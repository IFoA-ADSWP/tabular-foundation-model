# Ruff configuration for the verification gate. Issue #258, spec #252.
#
# There is no pyproject.toml in this repo, so this file is the only ruff config and
# it configures nothing but ruff. `extend-exclude` rather than `exclude` keeps
# ruff's built-in defaults in force.

extend-exclude = [
  # scripts/legacy_finetuning/ is not on the live path. Its entrypoints need the
  # upstream `tabpfn` package and a GPU, GLOSSARY.md records the fine-tuning pilot
  # as "a separate context that happens to share a word", and nothing in the current
  # suite imports it. It carries 25 pre-existing findings (E402, E731, F401, F541,
  # F841) in code nobody is going to run.
  #
  # Excluded deliberately, with the reason beside the exclusion, so that a future
  # reader can disagree with the judgement rather than discover the behaviour by
  # surprise. Re-include the tree when it is next touched for real; until then a
  # green gate says nothing about it, and this comment is the place that says so.
  "scripts/legacy_finetuning",
]
